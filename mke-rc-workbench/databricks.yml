bundle:
  name: mke-rc-workbench

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "mke-rc-workbench"
      description: "MKE Supply Root-Cause Workbench: watchlist, waterfall, classifier, scenarios, heatmap, Genie, portfolio health"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://adb-4482605715640778.18.azuredatabricks.net

    variables:
      sql_warehouse_id: 7bd33a82f4e92206
      genie_space_id: 01f1a542c3f7132681b64d8ff08b4033
      genie_space_name: P1 Actuals — Supply Plan vs Actual (SDP)
