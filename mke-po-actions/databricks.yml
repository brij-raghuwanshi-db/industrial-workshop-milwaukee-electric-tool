bundle:
  name: mke-po-actions

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  serving_endpoint_name:
    description: Foundation-model serving endpoint name for the live LLM explanation (llm/v1/chat). Obtain from `databricks serving-endpoints list`.

resources:
  apps:
    app:
      name: "mke-po-actions"
      description: "MKE P1 PO exception action cockpit: see off-plan items, ask why (Genie), approve PO actions with audit + live cascade"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://adb-4482605715640778.18.azuredatabricks.net

    variables:
      sql_warehouse_id: 7bd33a82f4e92206
      genie_space_id: 01f1a542c3f7132681b64d8ff08b4033
      genie_space_name: P1 Actuals — Supply Plan vs Actual (SDP)
      postgres_branch: projects/mke-po-actions/branches/production
      postgres_database: projects/mke-po-actions/branches/production/databases/databricks-postgres
      postgres_project: projects/mke-po-actions
      serving_endpoint_name: databricks-claude-sonnet-4-5
